<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183A2B">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kapehan POS </title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the shop itself. Bottle-green wall as the side rail (bottom tab bar on phones), white counter-top work surface,
   walnut slat counter on the order ticket, orange stool-seat highlights, gold bean-bag accents, warm track-light glow. */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#EAE6DE; --ink:#15201A; --muted:#5B675F; --line:#D9D4C9;
  --accent:#1E4A35; --accent-ink:#FFFFFF; --accent-soft:#DCE8E0; --roast:#4E2C1E;
  --wall:#183A2B; --wall-ink:#F2EEE6; --wood:#4E2C1E; --wood-2:#3A2016; --stool:#C2552B; --stool-ink:#FFFFFF; --gold:#C49A3E; --glow:rgba(255,196,120,.22);
  --warn:#9A6212; --warn-bg:#FAEFD6; --crit:#B3261E; --crit-bg:#FBE2DF; --ok:#1E4A35;
  --shadow:0 8px 28px rgba(21,32,26,.16);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --surface:#15201A; --surface-2:#1D2A23; --ink:#ECE8DF; --muted:#9AA69E; --line:#2A3830;
  --accent:#8CC9A6; --accent-ink:#0C1A12; --accent-soft:#1D3328; --roast:#E2B796;
  --wall:#12291F; --wall-ink:#F2EEE6; --wood:#4E2C1E; --wood-2:#3A2016; --stool:#E07447; --stool-ink:#1A0D07; --gold:#D8B05A; --glow:rgba(255,190,110,.14);
  --warn:#E8B252; --warn-bg:#382B12; --crit:#F28B82; --crit-bg:#3D1C19; --ok:#8CC9A6;
  --shadow:0 8px 28px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#15201A; --surface-2:#1D2A23; --ink:#ECE8DF; --muted:#9AA69E; --line:#2A3830;
  --accent:#8CC9A6; --accent-ink:#0C1A12; --accent-soft:#1D3328; --roast:#E2B796;
  --wall:#12291F; --wall-ink:#F2EEE6; --wood:#4E2C1E; --wood-2:#3A2016; --stool:#E07447; --stool-ink:#1A0D07; --gold:#D8B05A; --glow:rgba(255,190,110,.14);
  --warn:#E8B252; --warn-bg:#382B12; --crit:#F28B82; --crit-bg:#3D1C19; --ok:#8CC9A6;
  --shadow:0 8px 28px rgba(0,0,0,.55); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:700}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:212px 1fr;min-height:100%}
.rail{background:radial-gradient(120% 38% at 50% 0%, var(--glow), transparent 70%), var(--wall);color:var(--wall-ink);padding-block:20px;padding-left:max(14px, env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;border-right:6px solid var(--wood)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;padding:4px 10px 18px;line-height:1.1;margin-bottom:6px;border-bottom:3px solid var(--wood)}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.rail a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500;opacity:.8;transition:opacity .18s ease,background-color .18s ease,transform .18s ease}
.rail a:hover{opacity:1;background:rgba(255,255,255,.07)}
.rail a[aria-current="page"]{opacity:1;background:var(--stool);color:var(--stool-ink)}
@media (min-width:861px){.rail a:hover{transform:translateX(2px)}}
.rail svg{width:18px;height:18px;flex:none}
.rail .spacer{flex:1}
.rail .conn{font-size:11px;opacity:.7;padding:0 10px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding-block:16px;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar .grow{flex:1;min-width:0}
.topbar .date{font-size:12px;color:var(--muted)}
.view{padding-block:20px 40px;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.view.view-enter{animation:view-enter .2s ease-out both}

.banner{margin:12px 20px 0;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:500}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,filter .16s ease}
.btn:hover{border-color:var(--muted)}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(21,32,26,.1)}
.btn:not(:disabled):active{transform:translateY(0) scale(.98);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.iconbtn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(21,32,26,.12)}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:19px;height:19px}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;animation:pop-in .2s ease-out both}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
button.kpi{cursor:pointer}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
button.kpi:active{transform:translateY(0) scale(.99)}
.kpi.alert{border-color:var(--warn);background:var(--warn-bg)}
.kpi.alert .v{color:var(--warn)}
.quick{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .sub{font-size:12px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--ok)}
.chip.low{background:var(--warn-bg);color:var(--warn)}
.chip.out{background:var(--crit-bg);color:var(--crit)}
.chip.best{background:var(--stool);color:var(--stool-ink)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.low td{background:var(--warn-bg)}
tr.out td{background:var(--crit-bg)}
td.r,th.r{text-align:right}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:90px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
tr.low .meter i{background:var(--warn)} tr.out .meter i{background:var(--crit)}
.actions{display:flex;gap:6px;justify-content:flex-end}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1}
input[type=text],input[type=number],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;transition:border-color .16s ease,box-shadow .16s ease}
input[type=text]:focus-visible,input[type=number]:focus-visible,input[type=search]:focus-visible,select:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:13px;transition:background-color .16s ease,color .16s ease}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap;transition:transform .16s ease,background-color .16s ease,color .16s ease,border-color .16s ease}
.cats button:hover{transform:translateY(-1px)}
.cats button:active{transform:scale(.97)}
.cats button[aria-pressed="true"]{background:var(--wall);color:var(--wall-ink);border-color:var(--wall)}
.cats button[aria-pressed="true"] .muted{color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile:active{transform:scale(.98)}
.tile .n{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.15}
.tile .p{margin-top:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tile.short{border-style:dashed}
.tile .chip{align-self:flex-start}
.ticket{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 104px)}
.ticket{overflow:hidden}
.ticket header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;color:#F6EEE4;
  background:repeating-linear-gradient(90deg, var(--wood) 0 9px, var(--wood-2) 9px 11px);border-bottom:4px solid var(--surface-2)}
.tile .n::after{content:"";display:block;width:22px;height:3px;border-radius:2px;background:var(--gold);margin-top:8px}
.ticket .lines{overflow-y:auto;padding:4px 16px;flex:1;min-height:80px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .meta{font-size:12px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.stepper button{border:0;background:none;width:28px;height:28px;font-weight:700}
.stepper span{min-width:22px;text-align:center}
.ticket footer{padding:12px 16px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.sumrow{display:flex;justify-content:space-between;font-size:13px}
.sumrow.total{font-family:var(--f-display);font-size:22px;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.rank{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .rk{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted)}
.rank:first-child .rk{color:var(--stool)}
.rank .bar{grid-column:2/4;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--accent)}

/* menu mgmt */
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mcard ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}

/* bell */
.notif{position:absolute;right:0;top:48px;width:min(360px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column;max-height:70vh;animation:drop-in .18s ease-out both}
.notif header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.notif .list{overflow-y:auto}
.nitem{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.nitem.unread{background:var(--warn-bg)}
.nitem .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn)}
.nitem.out .dot{background:var(--crit)}
.nitem:not(.unread) .dot{background:var(--line)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,9,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade-in .16s ease-out both}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;animation:modal-in .2s cubic-bezier(.2,.8,.2,1) both}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.sizes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.size-options{display:grid;gap:6px}
.size-option{cursor:pointer}
.size-option.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.sizes button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:center;transition:transform .16s ease,background-color .16s ease,border-color .16s ease,box-shadow .16s ease}
.sizes button:hover{transform:translateY(-1px)}
.sizes button:active{transform:scale(.98)}
.sizes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.sizes b{display:block;font-family:var(--f-display);font-size:18px}
.check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;transition:transform .15s ease,border-color .15s ease,background-color .15s ease}
.check:hover{border-color:var(--accent);background:var(--accent-soft)}
.check:active{transform:scale(.99)}
.check .grow{flex:1}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recipe-line{display:grid;grid-template-columns:minmax(0,1fr) 90px auto auto;gap:6px;align-items:center}
.recipe-line.sized,.recipe-head.sized{grid-template-columns:minmax(0,1fr) repeat(4,54px) auto}
.recipe-head{display:grid;grid-template-columns:minmax(0,1fr) 90px auto auto;gap:6px;align-items:center}
.recipe-head span{font-size:10px;text-align:center;color:var(--muted)}
.recipe-line input[type=number]{width:100%;padding:6px}
.receipt{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.receipt .sumrow{font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px);animation:toast-in .22s ease-out both}
.toast.err{background:var(--crit);color:#fff}

/* salary */
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;transition:transform .16s ease,background-color .16s ease,color .16s ease,border-color .16s ease}
.subtabs button:hover{transform:translateY(-1px)}
.subtabs button:active{transform:scale(.97)}
.subtabs button[aria-pressed="true"]{background:var(--wall);color:var(--wall-ink);border-color:var(--wall)}
.emptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.emptile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.emptile:hover{transform:translateY(-1px);border-color:var(--accent)}
.emptile:active{transform:scale(.99)}
.emptile[aria-pressed="true"]{border-color:var(--stool);box-shadow:inset 0 0 0 1px var(--stool)}
.emptile small{display:block;color:var(--muted);font-size:12px}
table.tc{min-width:720px}
table.tc td,table.tc th{padding:5px 8px}
table.tc tr.has td{background:var(--accent-soft)}
.tin{width:74px;font-family:var(--f-mono);font-size:13px;padding:5px 6px!important;text-align:center}
.flag{color:var(--warn);font-size:12px;font-weight:600}
.paytot{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.paytot div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.paytot b{font-family:var(--f-display);font-size:20px;display:block}
.paytot .gt{background:var(--wall);color:var(--wall-ink)}
.cellnum{width:96px;text-align:right;font-family:var(--f-mono)}
.slip{border:1px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.slip-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--wood);padding-bottom:6px}
.slip-h b{font-family:var(--f-display);font-size:16px}
.slip-h span{letter-spacing:.12em;font-weight:700;color:var(--stool);font-size:12px}
.slip table{min-width:0;font-family:var(--f-mono);font-size:12.5px}
.slip td{padding:4px 2px;border:0}
.slip tr.tot td{border-top:1px dashed var(--line);font-weight:700;padding-top:6px}
.slip-s{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* login / user */
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 4px 4px 12px;font-weight:600;max-width:240px}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .role{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.lock{position:fixed;inset:0;z-index:40;background:radial-gradient(60% 45% at 50% 0%, var(--glow), transparent 70%), var(--wall);color:var(--wall-ink);display:grid;place-items:center;overflow-y:auto;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.lockbox{width:min(440px,100%);display:flex;flex-direction:column;gap:16px}
.lockbox .brandmark{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;padding-bottom:10px;border-bottom:4px solid var(--wood)}
.lockbox .brandmark small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.lockbox > h2,.lockbox h2{color:inherit}
.lockbox .muted{color:var(--wall-ink);opacity:.72}
.lockbox .panel{color:var(--ink)}
.lockbox .panel .muted{color:var(--muted);opacity:1}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.who button{border:1px solid transparent;background:var(--surface);color:var(--ink);border-radius:12px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;border-bottom:4px solid var(--stool);transition:transform .18s ease,box-shadow .18s ease}
.who button:hover{transform:translateY(-2px)}
.who .muted{color:var(--muted)!important;opacity:1!important}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:18px}
.dots{display:flex;gap:14px;justify-content:center;padding:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--wall-ink);opacity:.6}
.dots i.on{background:var(--gold);border-color:var(--gold);opacity:1}
.dots.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{border:1px solid transparent;background:var(--surface);color:var(--ink);border-radius:12px;height:58px;font-family:var(--f-display);font-size:22px;font-weight:700;transition:transform .12s ease,background-color .12s ease,box-shadow .12s ease}
.pad button:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.pad button:active{transform:scale(.96)}
.pad button:active{background:var(--surface-2)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes drop-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pop-in{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes view-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:1100px){.pos{grid-template-columns:minmax(0,1fr) 320px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .rail a{flex-direction:column;gap:3px;font-size:11px;padding:6px 8px}

  .pos,.grid2{grid-template-columns:1fr}

}
@media (max-width:520px){

const SUPABASE_URL="https://nmwmbvqugqvtfhzzimzs.supabase.co";

const CATS=["Espresso","Iced Coffee","Milktea","Pastries","Add-ons"];
const SIZES=["SH","SI","M","L"];
const SIZE_LABELS={SH:"Small 12oz (hot)",SI:"Small 12oz (iced)",M:"Medium 16oz (juvenile)",L:"Large 22oz (adult)"};
const SIZE_SHORT_LABELS={SH:"12oz hot",SI:"12oz iced",M:"16oz",L:"22oz"};

const PAYS=["Cash","GCash","Card"];
const VIEWS={dashboard:"Dashboard",pos:"POS / Cashier",inventory:"Inventory",reports:"Best Sellers & Reports",menu:"Menu Management",salary:"Salary",staff:"Staff"};
const CASHIER_VIEWS=["dashboard","pos","inventory"];
const ACCESS_OPTIONS=[["dashboard","Dashboard"],["pos","POS / Cashier"],["inventory","Inventory"],["restock","Restock inventory"],["reports","Reports"],["menu","Menu management"],["salary","Salary & payroll"]];
const DEFAULT_CASHIER_ACCESS=[...CASHIER_VIEWS,"restock"];
const ACCESS_LABELS=Object.fromEntries(ACCESS_OPTIONS);
const OWNER_ONLY=["inv-new","inv-edit","inv-del","cup-map-save","menu-new","menu-edit","menu-del","menu-dup","staff-new","staff-edit","staff-toggle","staff-del","sale-del","n-clear"];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso=n=>{n=Number(n)||0;return (n<0?"−":"")+"₱"+Math.abs(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})};
const peso0=n=>{n=Math.round(Number(n)||0);return (n<0?"−":"")+"₱"+Math.abs(n).toLocaleString("en-PH")};

function invStatus(i){const s=Number(i.stock)||0;if(s<=0)return"out";if(s<=Number(i.threshold||0))return"low";return"ok"}
function invKind(i){return i.kind==="cup"||(!i.kind&&/\bcups?\b/i.test(i.name||""))?"cup":"ingredient"}
function cupAssignments(){const setting=data.settings.get(CUP_SIZE_SETTING);return setting&&setting.bySize||{}}
function assignedCup(size,assignments){const id=assignments[size],item=id&&data.inventory.get(id);return item&&invKind(item)==="cup"&&item.unit==="pcs"?{id,item}:null}

function priceOf(m,size){
  if(!m.sized)return Number(m.price||0);
  const prices=m.prices||{},key=(size==="SH"||size==="SI")&&prices[size]==null?"S":size;
  return Number(prices[key]||0);
}
function fromPrice(m){return m.sized?Math.min(...SIZES.map(s=>priceOf(m,s)).filter(x=>x>0)):priceOf(m)}
function recipeAmount(r,size){
  const sizedQty=size&&r["qty"+size];
  if(sizedQty!==undefined&&sizedQty!==null)return Number(sizedQty)||0;
  if((size==="SH"||size==="SI")&&r.qtyS!==undefined&&r.qtyS!==null)return Number(r.qtyS)||0;
  if(!size&&r.qtyM!==undefined&&r.qtyM!==null)return Number(r.qtyM)||0;

let toastT;
function toast(msg,err){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}
  t.className="toast"+(err?" err":"");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

/* ---------- store ---------- */
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn,fn);queues[key]=p.catch(()=>{});return p}
function onWriteErr(e){
  console.error("Supabase write failed:",e);
  if(e&&e.code==="42501"){st.readOnly=true;showBanner("View-only ka sa POS na ito. I-check ang database permissions.");}
  else toast("Hindi na-save sa Supabase. Subukan ulit.",true);
}
function put(col,id,body){
  data[col].set(id,body);scheduleRender();
  if(mode==="db")return enqueue(col+"/"+id,()=>db.from(col).upsert({id,body},{onConflict:"id"})).then(r=>{if(r.error)throw r.error}).catch(onWriteErr);
  saveLocal();return Promise.resolve();
}
function del(col,id){
  data[col].delete(id);scheduleRender();
  if(mode==="db")return enqueue(col+"/"+id,()=>db.from(col).delete().eq("id",id)).then(r=>{if(r.error)throw r.error}).catch(onWriteErr);
  saveLocal();return Promise.resolve();
}
const LKEY="kapehan-pos-local";
function saveLocal(){try{const o={};COLS.forEach(c=>o[c]=[...data[c].entries()]);localStorage.setItem(LKEY,JSON.stringify(o))}catch(e){}}
function startLocal(){
  mode="local";
  try{const o=JSON.parse(localStorage.getItem(LKEY)||"null");if(o)COLS.forEach(c=>data[c]=new Map(o[c]||[]))}catch(e){}
  $("#conn").textContent="Local mode (sa device lang)";
  scheduleRender();
}
function showBanner(t){const b=$("#banner");b.textContent=t;b.hidden=!t}

async function connect(){
  if(!window.supabase||!window.supabase.createClient){
    showBanner("Hindi ma-load ang Supabase library. Suriin ang internet connection.");
    $("#conn").textContent="Offline";
    startLocal();
    return;
  }
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  mode="db";
  $("#conn").textContent="Connecting sa Supabase…";
  const timer=setTimeout(()=>{if(loaded.size<COLS.length)showBanner("Hindi pa maabot ang data ng Supabase. Baka mabagal ang internet.")},10000);
  let failed=false;
  await Promise.all(COLS.map(async c=>{
    const r=await db.from(c).select("id,body").limit(c==="sales"?1000:10000);
    if(r.error){failed=true;console.error("Supabase read failed:",c,r.error);return}
    data[c]=new Map((r.data||[]).map(row=>[row.id,row.body||{}]));
    loaded.add(c);
  }));
  clearTimeout(timer);
  if(failed){
    showBanner("Hindi ma-read ang ilang tables sa Supabase. I-check ang SQL schema at RLS policies.");
    $("#conn").textContent="Offline";
  }else{
    showBanner("");
    $("#conn").textContent="Naka-sync sa Supabase";
  }
  scheduleRender();

  COLS.forEach(c=>{
    db.channel("kapehan-"+c)
      .on("postgres_changes",{event:"*",schema:"public",table:c},payload=>{
        if(payload.eventType==="DELETE"){
          data[c].delete(payload.old.id);
        }else if(payload.new){
          data[c].set(payload.new.id,payload.new.body||{});
        }
        scheduleRender();
      })
      .subscribe();
  });
}

function buildDemo(){
  const shift=dayStart()-DEMO.base, o={};
  ["inventory","menu","staff","employees"].forEach(c=>o[c]=JSON.parse(JSON.stringify(DEMO[c])));
  o.sales=DEMO.sales.map(([id,s])=>[id,Object.assign({},s,{ts:s.ts+shift})]);
  o.notifications=DEMO.notifications.map(([id,n])=>[id,Object.assign({},n,{ts:n.ts+shift})]);
  // time cards for this month, up to yesterday
  let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const now=new Date(), ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0"), last=now.getDate()-1;
  const t=(h,m)=>String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  o.timecards=o.employees.map(([eid,e])=>{const rows={};
    for(let d=1;d<=last;d++){const wd=new Date(now.getFullYear(),now.getMonth(),d).getDay();
      if(e.payType==="oncall"?wd!==6&&wd!==0:wd===1)continue;
      const r={ai:t(7,50+Math.floor(rnd()*10)),ao:t(12,Math.floor(rnd()*5)),pi:t(12,55+Math.floor(rnd()*5)),po:t(18,Math.floor(rnd()*5))};
      if(rnd()<0.25){r.oi="18:00";r.oo=t(19+Math.floor(rnd()*2),Math.floor(rnd()*4)*15)}
      if(rnd()<0.06){delete r.pi;delete r.po;delete r.oi;delete r.oo}
      rows[d]=r}
    return [eid+"_"+ym,{empId:eid,month:ym,rows}]});
  o.payroll=[];o.settings=[["pay",{regEnd:"18:00",otRound:15,incomplete:0}]];
  return o;
}

function alertCheck(id,inv,prev,next){
  const th=Number(inv.threshold)||0;let level=null,text="";
  if(next<=0&&prev>0){level="out";text="Ubos na: "+inv.name}
  else if(next<=th&&prev>th){level="low";text="Paubos na: "+inv.name+" - "+fnum(next)+" "+inv.unit+" left"}
  if(level)put("notifications",uid(),{invId:id,text,level,ts:Date.now(),read:false});
}
function setStock(id,next){
  const inv=data.inventory.get(id);if(!inv)return;
  const prev=Number(inv.stock)||0;next=Math.max(0,Math.round(next*100)/100);
  put("inventory",id,Object.assign({},inv,{stock:next,updated:Date.now()}));
  alertCheck(id,inv,prev,next);
}

async function hashPin(salt,pin){
  const txt="kapehan:"+salt+":"+pin;
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(let i=0;i<txt.length;i++)h=((h<<5)+h+txt.charCodeAt(i))>>>0;return "d"+h.toString(16)}
}

async function pinKey(k){
  const L=st.login;
  if(k==="back"){L.pick=null;L.pin="";return renderLock()}
  if(k==="del"){L.pin=L.pin.slice(0,-1);return renderLock()}
  if(Date.now()<L.until||L.pin.length>=4)return;
  L.pin+=k;renderLock();
  if(L.pin.length===4){
    const s=data.staff.get(L.pick);const ok=s&&(await hashPin(s.salt,L.pin))===s.pinHash;
    if(ok){setMe(L.pick);toast("Naka-login: "+s.name);return}
    L.fails++;L.pin="";if(L.fails>=5){L.until=Date.now()+30000;L.fails=0}
    renderLock();const d=$("#dots");d&&d.classList.add("shake");toast("Mali ang PIN.",true);
  }
}
document.addEventListener("keydown",e=>{if($("#lock").hidden||$("#lock").dataset.mode!=="login"||!st.login.pick)return;
  if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace")pinKey("del");else if(e.key==="Escape")pinKey("back")});

/* ---------- POS ---------- */
function usage(lines){
  const u={},assignments=cupAssignments();
  const add=(m,size,qty,skipCups)=>{(m&&m.recipe||[]).forEach(r=>{if(!r.inv)return;
    const item=skipCups&&data.inventory.get(r.inv);if(item&&invKind(item)==="cup")return;
    const q=recipeAmount(r,size)*qty;u[r.inv]=(u[r.inv]||0)+q})};
  lines.forEach(l=>{
    const assigned=l.size&&assignedCup(l.size,assignments);
    const useAssignedCup=!!assigned;
    add(data.menu.get(l.menuId),l.size,l.qty,useAssignedCup);
    if(useAssignedCup)u[assigned.id]=(u[assigned.id]||0)+l.qty;
    (l.addons||[]).forEach(a=>{
      if(a.source==="inventory"){if(data.inventory.has(a.id))u[a.id]=(u[a.id]||0)+(Number(a.amount)||0)*l.qty}
      else add(data.menu.get(a.id),null,l.qty,false);
    });
  });
  return u;
}
function shortages(u){return Object.entries(u).map(([id,need])=>{const i=data.inventory.get(id);return{id,need,name:i?i.name:"(deleted item)",have:i?Number(i.stock)||0:0,unit:i?i.unit:""}}).filter(x=>x.have<x.need)}
function totals(){
  const sub=sum(st.cart,l=>l.unit*l.qty);let d=0,label="";
  if(st.disc==="sc"){d=sub*0.2;label="Senior/PWD 20%"}
  else if(st.disc==="promo"){d=sub*0.1;label="Promo 10%"}
  else if(st.disc==="custom"){d=Math.min(sub,Math.max(0,Number(st.discCustom)||0));label=d?"Discount "+peso0(d):""}
  d=Math.round(d*100)/100;
  return{sub,d,label,total:Math.round((sub-d)*100)/100};
}

function pickItem(id){
  const m=data.menu.get(id);if(!m)return;
  const addons=list("menu").filter(a=>a.category==="Add-ons"&&a.active!==false&&a.id!==id).map(a=>({source:"menu",id:a.id,name:a.name,price:priceOf(a)}))
    .concat(list("inventory").filter(a=>invKind(a)==="ingredient"&&a.isAddon===true).map(a=>({source:"inventory",id:a.id,name:a.name,price:Number(a.addonPrice)||0,amount:Number(a.addonQty)||0,unit:a.unit})));
  if(!m.sized&&(m.category==="Pastries"||m.category==="Add-ons"||!addons.length)){addToCart({menuId:id,name:m.name,size:null,qty:1,addons:[],unit:priceOf(m)});return}
  const sel={size:m.sized?"M":null,qty:1,addons:new Set()};
  const addonKey=a=>a.source+":"+a.id,addonByKey=new Map(addons.map(a=>[addonKey(a),a]));
  const selectedAddons=()=>[...sel.addons].map(k=>addonByKey.get(k)).filter(Boolean);

    const unit=priceOf(m,sel.size)+sum(selectedAddons(),a=>a.price);

     ${m.sized?`<div class="field"><label>Size</label><div class="size-options" role="radiogroup" aria-label="Size">${SIZES.map(s=>`<label class="check size-option ${sel.size===s?"selected":""}"><input type="radio" name="size-choice" data-s="${s}" value="${s}" ${sel.size===s?"checked":""}><span class="grow">${SIZE_LABELS[s]}</span><span class="num muted">${peso0(priceOf(m,s))}</span></label>`).join("")}</div></div>`:""}
     ${addons.length?`<div class="field"><label>Add-ons</label>${addons.map(a=>{const key=addonKey(a);return `<label class="check"><input type="checkbox" data-a="${esc(key)}" ${sel.addons.has(key)?"checked":""}><span class="grow">${esc(a.name)}</span><span class="num muted">${a.source==="inventory"?esc(fnum(a.amount)+" "+a.unit+" · "):""}+${peso0(a.price)}</span></label>`}).join("")}</div>`:""}
     <div class="field"><label>Quantity</label><span class="stepper" style="align-self:flex-start"><button data-q="-1" aria-label="Bawasan">−</button><span class="num">${sel.qty}</span><button data-q="1" aria-label="Dagdagan">+</button></span></div>
     <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-add>Add ${peso(unit*sel.qty)}</button></div>`,el=>{
      el.querySelectorAll("[data-s]").forEach(r=>r.onchange=()=>{sel.size=r.value;draw()});
      el.querySelectorAll("[data-a]").forEach(c=>c.onchange=()=>{c.checked?sel.addons.add(c.dataset.a):sel.addons.delete(c.dataset.a);draw()});
      el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{sel.qty=Math.max(1,sel.qty+Number(b.dataset.q));draw()});
      el.querySelector("[data-add]").onclick=()=>{closeModal();addToCart({menuId:id,name:m.name,size:sel.size,qty:sel.qty,unit,addons:selectedAddons().map(a=>({id:a.id,source:a.source,name:a.name,price:a.price,amount:a.amount||0}))})};
    });

function addToCart(l){
  const key=x=>x.menuId+"|"+x.size+"|"+x.addons.map(a=>(a.source||"menu")+":"+a.id).sort().join(",");
  const ex=st.cart.find(c=>key(c)===key(l));
  if(ex)ex.qty+=l.qty;else st.cart.push(l);
  st.override=false;scheduleRender();toast("Na-add: "+l.qty+"× "+l.name+(l.size?" ("+(SIZE_LABELS[l.size]||l.size)+")":""));
}
function checkout(){
  if(!st.cart.length||st.readOnly)return;
  const T=totals(), tend=Number(st.tendered)||0;
  if(st.pay==="Cash"&&tend<T.total){toast("Kulang ang cash na tinanggap. Ilagay ang halaga o pindutin ang Exact.",true);$("#tend")&&$("#tend").focus();return}
  const u=usage(st.cart), sh=shortages(u);
  if(sh.length&&!st.override){
    openModal(`<h2>Kulang ang stock</h2><p class="muted">Base sa recipe, selected add-ons, at cup assignments, hindi sapat ang mga ito para sa order:</p>
      <div class="rows">${sh.map(s=>`<div class="row"><div class="grow"><b>${esc(s.name)}</b><div class="sub num">Kailangan ${fnum(s.need)} ${esc(s.unit)}, meron ${fnum(s.have)}</div></div></div>`).join("")}</div>
      <p class="muted">Kung may stock pa talaga (hindi lang na-update), pwede mong ituloy. Magiging 0 ang stock ng mga ito.</p>
      <div class="foot"><button class="btn" data-close>Bumalik</button><button class="btn primary" data-go>Ituloy ang checkout</button></div>`,el=>{el.querySelector("[data-go]").onclick=()=>{st.override=true;closeModal();checkout()}});
    return;
  }
  const sale={ts:Date.now(),items:st.cart.map(l=>({menuId:l.menuId,name:l.name,size:l.size,qty:l.qty,unit:l.unit,addons:l.addons})),
    subtotal:T.sub,discount:T.d,discountLabel:T.label,total:T.total,payment:st.pay};
  const cashier=me();if(cashier){sale.cashierId=cashier.id;sale.cashierName=cashier.name}
  if(st.pay==="Cash"){sale.tendered=tend;sale.change=Math.round((tend-T.total)*100)/100}
  if(st.pay==="GCash"&&st.gref)sale.ref=st.gref;
  put("sales",uid(),sale);
  Object.entries(u).forEach(([id,need])=>{const i=data.inventory.get(id);if(i)setStock(id,(Number(i.stock)||0)-need)});
  st.cart=[];st.tendered="";st.gref="";st.disc="none";st.discCustom="";st.override=false;
  openModal(`<h2>Bayad na ✓</h2><div class="receipt">
    ${sale.items.map(i=>`<div class="sumrow"><span>${i.qty}× ${esc(i.name)}${i.size?" ("+esc(SIZE_LABELS[i.size]||i.size)+")":""}${i.addons.length?" +"+esc(i.addons.map(a=>a.name).join(", ")):""}</span><span>${peso(i.unit*i.qty)}</span></div>`).join("")}
    ${sale.discount?`<div class="sumrow"><span>${esc(sale.discountLabel)}</span><span>−${peso(sale.discount)}</span></div>`:""}
    <div class="sumrow" style="font-weight:700;border-top:1px dashed var(--line);padding-top:6px"><span>TOTAL · ${esc(sale.payment)}</span><span>${peso(sale.total)}</span></div>
    ${sale.payment==="Cash"?`<div class="sumrow"><span>Cash</span><span>${peso(sale.tendered)}</span></div><div class="sumrow" style="font-weight:700"><span>Sukli</span><span>${peso(sale.change)}</span></div>`:""}
    ${sale.ref?`<div class="sumrow"><span>GCash ref</span><span>${esc(sale.ref)}</span></div>`:""}
   </div><p class="muted" style="margin:0">Na-record ang sale at nabawasan na ang recipe items, selected add-ons, at assigned cups sa Inventory.</p>
   <div class="foot"><button class="btn primary" data-close>Bagong order</button></div>`);
}

function rankItems(sales){
  const m={};
  sales.forEach(s=>(s.items||[]).forEach(i=>{if(isAddon(i.menuId))return;const k=i.menuId;m[k]=m[k]||{id:k,name:i.name,qty:0,rev:0};m[k].qty+=Number(i.qty)||0;m[k].rev+=(Number(i.unit)||0)*(Number(i.qty)||0)}));
  return Object.values(m).sort((a,b)=>b.qty-a.qty||b.rev-a.rev);
}
function periodRange(){
  const t0=dayStart();
  if(st.period==="daily")return{from:t0,to:t0+DAY,label:"Ngayong araw"};
  if(st.period==="weekly")return{from:t0-6*DAY,to:t0+DAY,label:"Huling 7 araw"};
  return{from:t0-29*DAY,to:t0+DAY,label:"Huling 30 araw"};
}
function buckets(sales,R){
  if(st.period==="daily"){const b=[];for(let h=6;h<=22;h++)b.push({k:h,label:(h%12||12)+(h<12?"a":"p"),v:0});
    sales.forEach(s=>{const h=new Date(s.ts).getHours();const x=b.find(y=>y.k===h)||(h<6?b[0]:b[b.length-1]);x.v+=s.total});return b}
  const n=Math.round((R.to-R.from)/DAY),b=[];
  for(let i=0;i<n;i++){const d=new Date(R.from+i*DAY+DAY/2);b.push({k:dayStart(d.getTime()),label:st.period==="weekly"?d.toLocaleDateString("en-PH",{weekday:"short"}):(d.getDate()),v:0})}
  sales.forEach(s=>{const x=b.find(y=>y.k===dayStart(s.ts));if(x)x.v+=s.total});return b;
}
function barChart(b){
  const W=640,H=220,L=48,B=26,T=14,max=Math.max(1,...b.map(x=>x.v));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=[1,2,2.5,5,10].map(f=>f*step).find(v=>max/v<=5)||step*10;
  const top=Math.ceil(max/nice)*nice, y=v=>T+(H-T-B)*(1-v/top), bw=(W-L-8)/b.length;
  let g="";for(let v=0;v<=top+1e-9;v+=nice)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v>=1000?(v/1000)+"k":v}</text>`;
  const every=b.length>16?5:b.length>10?2:1, mi=b.reduce((a,x,i)=>x.v>b[a].v?i:a,0);
  b.forEach((x,i)=>{const h=H-B-y(x.v),bx=L+4+i*bw;g+=`<rect x="${bx+bw*0.15}" y="${y(x.v)}" width="${bw*0.7}" height="${Math.max(0,h)}" rx="3" fill="${i===mi&&x.v?"var(--stool)":"var(--accent)"}"><title>${esc(x.label)}: ${peso0(x.v)}</title></rect>`;
    if(i%every===0||i===b.length-1)g+=`<text x="${bx+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(x.label)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue chart">${g}</svg>`;
}
function vReports(){

  <div class="kpis">

  </div>
  <div class="panel chart"><div class="panel-head"><h2>Revenue ${st.period==="daily"?"per oras":"per araw"}</h2><span class="muted">${byPay.map(([p,v])=>p+" "+peso0(v)).join(" · ")}</span></div>${barChart(buckets(sales,R))}</div>
  <div class="grid2">
   <div class="panel"><div class="panel-head"><h2>Best sellers</h2><div class="seg" role="group" aria-label="Rank by"><button data-act="rankBy" data-r="qty" aria-pressed="${st.rankBy==="qty"}">Qty</button><button data-act="rankBy" data-r="rev" aria-pressed="${st.rankBy==="rev"}">Revenue</button></div></div>
    <div>${sorted.length?sorted.map((r,i)=>`<div class="rank"><span class="rk">${i+1}</span><div><b>${esc(r.name)}</b> ${i===0?'<span class="chip best">Best seller</span>':""}</div><div class="num" style="text-align:right">${st.rankBy==="qty"?r.qty+" sold":peso0(r.rev)}<div class="muted" style="font-size:12px">${st.rankBy==="qty"?peso0(r.rev):r.qty+" sold"}</div></div><div class="bar"><i style="width:${(st.rankBy==="qty"?r.qty:r.rev)/maxV*100}%"></i></div></div>`).join(""):`<div class="empty">Walang benta sa period na ito.</div>`}</div></div>
   <div class="panel"><div class="panel-head"><h2>Hindi masyadong mabenta</h2></div>
    <div class="rows">${slow.length?slow.map(r=>`<div class="row"><div class="grow"><b>${esc(r.name)}</b><div class="sub">${r.qty?r.qty+" sold · "+peso0(r.rev):"Walang benta sa period na ito"}</div></div>${r.qty?"":'<span class="chip low">0 sold</span>'}</div>`).join(""):`<div class="empty">Wala pang menu items.</div>`}</div>
    <p class="muted" style="font-size:12px;margin:12px 0 0">Tip: i-promo o i-bundle ang mga ito, o tanggalin sa menu kung matagal nang mahina.</p></div>
  </div>
  ${byCashier(sales)}
  ${salesHistory()}`;
}

/* ---------- SALARY (Owner only, same flow as Threadix payroll) ---------- */
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const ymNow=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const sal={tab:"cards",month:ymNow(),half:"all",open:null,adj:{},by:"week",emp:"all",admin:null};
const TC_COLS=[["ai","AM in"],["ao","AM out"],["pi","PM in"],["po","PM out"],["oi","OT in"],["oo","OT out"]];
const PAYTYPES={regular:"Regular (kada araw)",oncall:"On-call (kapag tinawag)"};
const paySet=()=>Object.assign({regEnd:"18:00",otRound:0,incomplete:0},data.settings.get("pay")||{});
const dim=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const fmtT=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const monthLabel=ym=>MONTHS[+ym.slice(5,7)-1]+" "+ym.slice(0,4);
const periodLabel=(ym,half)=>monthLabel(ym)+(half==="1-15"?" (1st–15th)":half==="16-end"?" (16th–end)":"");
const hm=h=>{const m=Math.round(h*60),a=Math.floor(m/60),b=m%60;return (a?a+" h":"")+(a&&b?" ":"")+(b||!a?b+" min":"")};
const empList=()=>list("employees").sort((a,b)=>a.name.localeCompare(b.name));
function parseT(s){
  s=String(s==null?"":s).trim().toLowerCase().replace(/\s+/g,"");if(!s)return null;
  const ap=/([ap])\.?m?\.?$/.exec(s);let t=s.replace(/[^0-9:.]/g,""),h,mi;
  if(/[:.]/.test(t)){[h,mi]=t.split(/[:.]/).map(Number)}
  else if(/^\d{3,4}$/.test(t)){t=t.padStart(4,"0");h=+t.slice(0,2);mi=+t.slice(2)}
  else if(/^\d{1,2}$/.test(t)){h=+t;mi=0}else return null;
  if(isNaN(h)||isNaN(mi))return null;
  if(ap){if(h>12)return null;if(h===12)h=0;if(ap[1]==="p")h+=12}
  if(h>23||mi>59)return null;return h*60+mi;
}
const roundOT=(h,step)=>step>0?Math.floor(h*60/step+1e-9)*step/60:Math.round(h*100)/100;
// Same rules as Threadix: AM pair + PM pair = 1 day, one half = ½ day, OT from OT-in (or PM-out / shift end) to OT-out.
function dayCalc(r,S){
  r=r||{};const t=k=>r[k]?parseT(r[k]):null,ai=t("ai"),ao=t("ao"),pi=t("pi"),po=t("po"),oi=t("oi"),oo=t("oo"),regEnd=parseT(S.regEnd)??1080;
  const hasAny=[ai,ao,pi,po,oi,oo].some(x=>x!=null),amDone=ai!=null&&ao!=null,pmDone=pi!=null&&(po!=null||oo!=null||oi!=null);
  let ot=0,flag="",otStart=oi!=null?oi:(po!=null?po:null);
  if(oo!=null){if(otStart==null)otStart=regEnd;if(oi==null&&po==null&&pi==null&&ai==null)flag="overtime lang";ot=((oo-otStart+1440)%1440)/60;if(ot>16)flag="sobrang habang OT, i-check"}
  else if(oi!=null)flag="walang OT out";
  ot=roundOT(ot,S.otRound||0);
  let day=0;const full=amDone&&pmDone,half=amDone!==pmDone;
  if(r.d!==undefined&&r.d!==null&&r.d!=="")day=+r.d;else if(full)day=1;else if(half){day=0.5;flag=flag||(amDone?"walang PM":"walang AM")}else if(hasAny){day=+S.incomplete||0;flag=flag||"kulang ang punch"}
  return{day,ot,flag,hasAny};
}
function cardCalc(c,S,half){
  let days=0,ot=0,otDays=0,flags=0;const n=dim(c.month);
  for(let d=1;d<=n;d++){if(half==="1-15"&&d>15)continue;if(half==="16-end"&&d<=15)continue;const r=c.rows&&c.rows[d];if(!r)continue;const k=dayCalc(r,S);days+=k.day;ot+=k.ot;if(k.ot>0)otDays++;if(k.flag)flags++}
  return{days:Math.round(days*100)/100,otHours:Math.round(ot*100)/100,otDays,flags};
}
const tcId=(empId,ym)=>empId+"_"+ym;
function payFor(e,k){
  const unit=e.otUnit==="day"?"day":e.otUnit==="minute"?"minute":"hour",q=unit==="day"?k.otDays:unit==="minute"?k.otHours*60:k.otHours;
  const reg=Math.round(k.days*(+e.rate||0)*100)/100,ot=Math.round(q*(+e.otRate||0)*100)/100;
  return{unit,q:Math.round(q*100)/100,reg,ot,total:Math.round((reg+ot)*100)/100};
}
function payRows(){
  const S=paySet();
  return list("timecards").filter(c=>c.month===sal.month&&data.employees.has(c.empId)).map(c=>{
    const e=data.employees.get(c.empId),k=cardCalc(c,S,sal.half),p=payFor(e,k),adj=Number(sal.adj[c.empId])||0;
    return{empId:c.empId,name:e.name,position:e.position||"",days:k.days,rate:+e.rate||0,regular:p.reg,otQty:p.q,otUnit:p.unit,otRate:+e.otRate||0,otPay:p.ot,adj,total:Math.round((p.total+adj)*100)/100,flags:k.flags};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

async function saveFile(filename,text,type){
  if(!(window.claude&&window.claude.use)){ // opened as a plain web page (not inside Claude): normal browser download
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Na-download: "+filename)}catch(e){toast("Hindi na-download ang file.",true)}
    return;
  }
  let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
  if(!dl){toast("Hindi available ang download dito. Buksan ang POS sa claude.ai.",true);return}
  try{await dl.save({filename,data:new Blob([text],{type})});toast("Na-save: "+filename)}catch(e){if(e&&e.code!=="dismissed"&&e.code!=="declined")toast("Hindi na-download ang file.",true)}
}

/* chart */
function salChartData(){
  const S=paySet(),buckets={},iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const keyOf=d=>{if(sal.by==="month")return iso(d).slice(0,7);const m=new Date(d);m.setDate(m.getDate()-((m.getDay()+6)%7));return iso(m)};
  list("timecards").forEach(c=>{const e=data.employees.get(c.empId);if(!e||(sal.emp!=="all"&&sal.emp!==c.empId))return;const n=dim(c.month);
    for(let d=1;d<=n;d++){const r=c.rows&&c.rows[d];if(!r)continue;const k=dayCalc(r,S);if(!k.day&&!k.ot)continue;
      const key=keyOf(new Date(+c.month.slice(0,4),+c.month.slice(5,7)-1,d)),b=buckets[key]||(buckets[key]={reg:0,ot:0});
      b.reg+=k.day*(+e.rate||0);b.ot+=e.otUnit==="day"?(k.ot>0?+e.otRate||0:0):e.otUnit==="minute"?k.ot*60*(+e.otRate||0):k.ot*(+e.otRate||0)}});
  const out=[],now=new Date(),cur=keyOf(now);
  for(let i=11;i>=0;i--){const d=new Date(now);if(sal.by==="month")d.setMonth(d.getMonth()-i,1);else d.setDate(d.getDate()-7*i);const key=keyOf(d),b=buckets[key]||{reg:0,ot:0};
    out.push({key,label:sal.by==="month"?MONTHS[+key.slice(5,7)-1].slice(0,3):new Date(key+"T00:00").toLocaleDateString("en-PH",{month:"short",day:"numeric"}),reg:Math.round(b.reg),ot:Math.round(b.ot),cur:key===cur})}
  return out;
}
function salChart(){
  const D=salChartData(),tot=sum(D,x=>x.reg+x.ot),max=Math.max(1,...D.map(x=>x.reg+x.ot)),best=D.reduce((a,x)=>x.reg+x.ot>a.reg+a.ot?x:a,D[0]);
  const W=640,H=230,L=52,B=26,T=14,step=Math.pow(10,Math.floor(Math.log10(max))),nice=[1,2,2.5,5,10].map(f=>f*step).find(v=>max/v<=5)||step*10,top=Math.ceil(max/nice)*nice,y=v=>T+(H-T-B)*(1-v/top),bw=(W-L-8)/D.length;
  let g="";for(let v=0;v<=top+1e-9;v+=nice)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v>=1000?(v/1000)+"k":v}</text>`;
  D.forEach((x,i)=>{const bx=L+4+i*bw+bw*.15,w=bw*.7;g+=`<rect x="${bx}" y="${y(x.reg)}" width="${w}" height="${Math.max(0,H-B-y(x.reg))}" fill="var(--accent)"><title>${esc(x.label)}: regular ${peso0(x.reg)}</title></rect>`;
    if(x.ot)g+=`<rect x="${bx}" y="${y(x.reg+x.ot)}" width="${w}" height="${Math.max(0,y(x.reg)-y(x.reg+x.ot))}" fill="var(--stool)"><title>${esc(x.label)}: overtime ${peso0(x.ot)}</title></rect>`;
    if(i%2===0||i===D.length-1)g+=`<text x="${L+4+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${x.cur?"var(--ink)":"var(--muted)"}" font-weight="${x.cur?700:400}">${esc(x.label)}</text>`});
  return `<div class="panel"><div class="panel-head"><div><h2>Payroll cost kada ${sal.by==="week"?"linggo":"buwan"}</h2><span class="muted">Mula sa time cards, gamit ang kasalukuyang rate ng bawat employee. Huling 12 ${sal.by==="week"?"linggo":"buwan"}.</span></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><div class="seg" role="group"><button data-sal="by" data-v="week" aria-pressed="${sal.by==="week"}">Weekly</button><button data-sal="by" data-v="month" aria-pressed="${sal.by==="month"}">Monthly</button></div>
   <select id="salEmp" data-salin="emp" aria-label="Employee"><option value="all">Lahat ng employee</option>${empList().map(e=>`<option value="${esc(e.id)}" ${sal.emp===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}</select></div></div>
   <div class="kpis" style="margin-bottom:14px"><div class="kpi"><span class="label">Total (12 ${sal.by==="week"?"linggo":"buwan"})</span><span class="v">${peso0(tot)}</span></div><div class="kpi"><span class="label">Average</span><span class="v">${peso0(tot/D.length)}</span></div><div class="kpi"><span class="label">Overtime</span><span class="v">${peso0(sum(D,x=>x.ot))}</span></div><div class="kpi"><span class="label">Pinakamataas</span><span class="v">${peso0(best.reg+best.ot)}</span><span class="d">${esc(best.label)}</span></div></div>
   ${tot?`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payroll cost chart">${g}</svg></div><div class="legend"><span><i style="background:var(--accent)"></i>Regular pay</span><span><i style="background:var(--stool)"></i>Overtime</span>${sal.by==="week"?"<span>Nagsisimula ang linggo sa Lunes</span>":""}</div>`:`<div class="empty">Walang time-card data sa huling 12 ${sal.by==="week"?"linggo":"buwan"}.</div>`}</div>`;
}

  el.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  if(mount)mount(el);
  if(!el.contains(document.activeElement)){const f=el.querySelector("[data-add],[data-save],[data-go],[data-close]");f&&f.focus()}
}
function closeModal(){$("#modalroot").innerHTML="";scheduleRender()}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!e.target.closest("#npanel")&&!e.target.closest("#bell")&&!$("#npanel").hidden)toggleBell(false);
  if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(st.readOnly&&["restock","inv-new","inv-edit","inv-del","menu-new","menu-edit","menu-del","n-read","n-readall","n-clear"].concat(OWNER_ONLY).includes(a)){toast("View-only ka, hindi ka makakapag-edit.",true);return}
  if(OWNER_ONLY.includes(a)&&!isOwner()){toast("Owner lang ang pwedeng gumawa nito.",true);return}
  if(a==="restock"&&!canRestock()){toast("Wala kang pahintulot mag-restock.",true);return}
  switch(a){
    case"logout":toggleBell(false);setMe("");break;
    case"staff-new":staffForm(null);break;
    case"staff-edit":staffForm(id);break;
    case"staff-toggle":staffToggle(id);break;
    case"staff-del":staffDelete(id);break;
    case"sale-del":saleDelete(id);return;
    case"go":st.invF=b.dataset.filter||"all";st.invGroup="all";location.hash=b.dataset.to;break;
    case"cat":st.cat=b.dataset.c;scheduleRender();break;
    case"pick":pickItem(id);break;
    case"qty":{const l=st.cart[b.dataset.i];l.qty+=Number(b.dataset.d);if(l.qty<=0)st.cart.splice(b.dataset.i,1);st.override=false;scheduleRender();break}
    case"cart-clear":st.cart=[];scheduleRender();break;
    case"pay":st.pay=b.dataset.p;scheduleRender();break;
    case"tendq":st.tendered=String(b.dataset.v);scheduleRender();break;
    case"checkout":checkout();break;
    case"invGroup":st.invGroup=b.dataset.v;st.invF="all";scheduleRender();break;
    case"invF":st.invF=b.dataset.f;scheduleRender();break;
    case"cup-map-save":saveCupAssignments();break;
    case"inv-new":invForm(null);break;
    case"inv-edit":invForm(id);break;
    case"inv-del":invDelete(id);break;
    case"restock":toggleBell(false);restockForm(id);break;
    case"period":st.period=b.dataset.p;scheduleRender();break;
    case"rankBy":st.rankBy=b.dataset.r;scheduleRender();break;
    case"menu-new":menuForm(null);break;
    case"menu-edit":menuForm(id);break;
    case"menu-dup":menuForm(id,true);break;
    case"menu-del":menuDelete(id);break;
    case"n-read":put("notifications",id,Object.assign({},data.notifications.get(id),{read:true}));break;
    case"n-readall":list("notifications").filter(n=>!n.read).forEach(n=>put("notifications",n.id,Object.assign({},data.notifications.get(n.id),{read:true})));break;
    case"n-clear":list("notifications").forEach(n=>del("notifications",n.id));break;
  }
});
document.addEventListener("input",e=>{const a=e.target.dataset&&e.target.dataset.act;if(!a)return;
  if(a==="invQ"){st.invQ=e.target.value;scheduleRender()}
  else if(a==="tend"){st.tendered=e.target.value;scheduleRender()}
  else if(a==="gref"){st.gref=e.target.value}
  else if(a==="discAmt"){st.discCustom=e.target.value;scheduleRender()}});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.act==="disc"){st.disc=e.target.value;scheduleRender()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modalroot").innerHTML)closeModal();else if(!$("#npanel").hidden)toggleBell(false)}});
$("#bell").onclick=()=>toggleBell();
window.addEventListener("hashchange",route);
$("#today").textContent=new Date().toLocaleDateString("en-PH",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
route();connect();
})();
</script>

</body>
</html>
